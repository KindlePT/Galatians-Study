<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paul's First Journey</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Yellowtail&display=swap">
<style>
/* Layout: one-screen presenting view. Map fills the left, detail card and stop chips sit right.
   Pen draws on a canvas over the map. Finger taps stops. Stacks to one column on narrow screens. */
:root{
  --bg:#F6F1E4; --panel:#FFFDF7; --fg:#1B2A33; --muted:#5C6B73; --line:#D9CFB6;
  --accent:#D9621F; --teal:#2E6F94; --olive:#7A8A3A; --sky:#5E9BB8;
  --sea:#C3DCE8; --land:#F3E6C4; --coast:#9DB7C4; --mtn:#7A6A45; --zone-s:rgba(122,138,58,.22); --zone-n:rgba(46,111,148,.10);
  --out:#D9621F; --ret:#2E6F94; --halo:#F3E6C4; --seatext:#4C7C94;
  --space:#E7DCBE; --wave:#8FB8CB; --glow:#E3F0F5; --relief:#8A7650; --vig:#8A6B3B; --lake:#A9CDDC; --frame:#1B2A33;
  --c1:#1B2A33; --c2:#D9621F; --c3:#4F6A1B; --c4:#2E6F94; --hl:#F2C230;
  --font-display:'Bowlby One','Arial Black',sans-serif;
  --font-body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-label:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101B21; --panel:#18262E; --fg:#F0E8D2; --muted:#A5B3B9; --line:#2D3F49;
    --accent:#F08A4B; --teal:#6FB0D2; --olive:#A6B85A; --sky:#8CBBD3;
    --sea:#142A36; --land:#2A352F; --coast:#3E5B69; --mtn:#B9A878; --zone-s:rgba(166,184,90,.22); --zone-n:rgba(111,176,210,.14);
    --out:#F08A4B; --ret:#6FB0D2; --halo:#2A352F; --seatext:#7FA9BD;
    --space:#0A1217; --wave:#2B5467; --glow:#1D4558; --relief:#000000; --vig:#000000; --lake:#1D4A5E; --frame:#C9BFA3;
    --c1:#F0E8D2; --c2:#F08A4B; --c3:#B5CC63; --c4:#7FC0E3; --hl:#F2C230;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101B21; --panel:#18262E; --fg:#F0E8D2; --muted:#A5B3B9; --line:#2D3F49;
  --accent:#F08A4B; --teal:#6FB0D2; --olive:#A6B85A; --sky:#8CBBD3;
  --sea:#142A36; --land:#2A352F; --coast:#3E5B69; --mtn:#B9A878; --zone-s:rgba(166,184,90,.22); --zone-n:rgba(111,176,210,.14);
  --out:#F08A4B; --ret:#6FB0D2; --halo:#2A352F; --seatext:#7FA9BD;
    --space:#0A1217; --wave:#2B5467; --glow:#1D4558; --relief:#000000; --vig:#000000; --lake:#1D4A5E; --frame:#C9BFA3;
  --c1:#F0E8D2; --c2:#F08A4B; --c3:#B5CC63; --c4:#7FC0E3; --hl:#F2C230;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(20px,2.4vw,30px);margin:0;letter-spacing:.01em;color:var(--teal);text-wrap:balance}
.sub{font-family:var(--font-label);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--muted)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:14px}
.mapcol{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--sea)}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg{transform-origin:0 0;transition:transform .8s cubic-bezier(.55,0,.2,1),opacity .55s ease .1s,visibility 0s linear .8s;visibility:hidden;opacity:0;pointer-events:none}
.stage svg.active{visibility:visible;opacity:1;pointer-events:auto;transition:transform .8s cubic-bezier(.55,0,.2,1),opacity .55s ease .2s,visibility 0s}
.stage.noanim svg,.stage.noanim svg.active{transition:none!important}
.stage canvas{pointer-events:none;transition:opacity .25s}
@media (prefers-reduced-motion:reduce){.stage svg,.stage svg.active{transition:none!important}}
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px}
.viewbar .tb:disabled{opacity:.4;cursor:default}
.space{fill:var(--space)}
.atmo{fill:var(--glow)}
.fbox{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:8 5}
.zoomto{cursor:pointer}
.zoomto:focus-visible{outline:3px solid var(--accent)}
.zoomto:hover .fbox{fill-opacity:.22}
.pulse{fill:none;stroke:var(--accent);stroke-width:3;transform-box:fill-box;transform-origin:center;opacity:.55;transform:scale(1.8)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2.4s ease-out infinite}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.pin{fill:var(--accent);stroke:var(--panel);stroke-width:2.5}
.cdot{fill:var(--panel);stroke:var(--fg);stroke-width:2}
.stage.hide-num .stop .num,.stage.hide-num .stop .patch,.stage.hide-num .stop .stitch{display:none}
.stage.hide-num .stop .dot{transform:scale(.55);transform-box:fill-box;transform-origin:center}
.stage.hide-num .stop .ring{transform:scale(.7);transform-box:fill-box;transform-origin:center}
.stop .hit{fill:transparent;stroke:none}
.chips[hidden]{display:none}
.stage.reveal .stop.unrev .num,.stage.reveal .stop.unrev .patch,.stage.reveal .stop.unrev .stitch,.stage.reveal .slbl.unrev{display:none}
.stage.reveal .stop.unrev .dot{transform:scale(.5);transform-box:fill-box;transform-origin:center;opacity:.6}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb{font-family:var(--font-label);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;min-height:40px;cursor:pointer}
.tb[aria-pressed="true"],.tb.on{background:var(--teal);color:#fff;border-color:var(--teal)}
:root[data-theme="dark"] .tb[aria-pressed="true"]{color:#0E1A20}
.tb:focus-visible,.chip:focus-visible,.sw:focus-visible,.stop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.sz{width:40px}
.sep{width:1px;height:26px;background:var(--line)}
.layers{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-family:var(--font-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--muted)}
.layers label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:32px}
.layers input{width:18px;height:18px;accent-color:var(--teal)}
.key{display:inline-block;width:26px;height:0;border-top:4px solid var(--out);vertical-align:middle}
.key.ret{border-top-color:var(--ret)}
.hint{font-size:14px;color:var(--muted);font-family:var(--font-label);letter-spacing:.04em}
.side{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-label);font-weight:700;font-size:17px;min-width:40px;min-height:40px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-current="true"]{color:#1B1208}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;overflow:auto;flex:1;min-height:0}
.kicker{font-family:var(--font-label);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--accent)}
.card h2{font-family:var(--font-body);font-weight:700;font-size:clamp(22px,2.2vw,28px);line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.ref{font-family:var(--font-label);font-weight:600;letter-spacing:.06em;font-size:16px;color:var(--muted);margin-bottom:10px}
.blk{margin-top:10px}
.lab{font-family:var(--font-label);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);margin-bottom:2px}
.blk p{margin:0;font-size:clamp(16px,1.5vw,18px)}
.read{font-weight:600}
.step{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.vcard p+p{margin-top:6px}
/* map */
.sea{fill:var(--sea)}
.wavefill{fill:url(#waves)}
.glow{fill:none;stroke:var(--glow);stroke-linejoin:round}
.lake{fill:var(--lake);stroke:var(--coast);stroke-width:1.2}
.grat{stroke:var(--muted);stroke-width:.6;stroke-dasharray:2 5;opacity:.4;fill:none}
.gl{font-family:var(--font-label);font-size:11px;fill:var(--muted);opacity:.8;letter-spacing:.08em}
.frame{fill:none;stroke:var(--frame)}
.rlbl{font-family:var(--font-label);font-weight:600;font-size:14px;letter-spacing:.32em;fill:var(--muted);opacity:.85;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}
.script{font-family:'Yellowtail','Brush Script MT',cursive;font-size:26px;fill:var(--accent);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.casing{fill:none;stroke:var(--halo);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.casing.sea{stroke-dasharray:9 7}
.stop .patch{fill:var(--panel);stroke:var(--fg);stroke-width:2}
.stop .stitch{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:2.4 2.4}
.stop.on .patch{stroke:var(--accent)}
.land{fill:var(--land);stroke:var(--coast);stroke-width:1.5}
.mtn{fill:none;stroke:var(--mtn);stroke-width:1.6;opacity:.5;stroke-linejoin:round}
.zoneS{fill:var(--zone-s);stroke:var(--olive);stroke-width:2;stroke-dasharray:7 5}
.zoneN{fill:var(--zone-n);stroke:var(--teal);stroke-width:2;stroke-dasharray:3 5}
.zlbl{font-family:var(--font-label);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.sealbl{font-family:var(--font-body);font-style:italic;font-size:17px;fill:var(--seatext);opacity:.9}
.lbl{font-family:var(--font-label);font-weight:700;font-size:17px;fill:var(--fg);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.route{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.route.sea{stroke-dasharray:9 7}
.route-out .route{stroke:var(--out)}
.route-ret .route{stroke:var(--ret)}
.arr-out{fill:var(--out)} .arr-ret{fill:var(--ret)}
.stop{cursor:pointer}
.stop .dot{fill:var(--panel);stroke:var(--fg);stroke-width:2.5}
.stop .num{font-family:var(--font-label);font-weight:700;font-size:16px;fill:var(--fg);text-anchor:middle;dominant-baseline:central}
.stop .ring{fill:none;stroke:var(--accent);stroke-width:4;opacity:0}
.stop.on .ring{opacity:1}
.stop.on .dot{fill:var(--accent);stroke:var(--accent)}
.stop.on .num{fill:#fff}
.anc .dot{fill:var(--panel);stroke:var(--teal);stroke-width:2.5}
.stage.hide-out .route-out,.stage.hide-ret .route-ret,.stage.hide-zone .zone,.stage.hide-lbl .lbl,.stage.hide-lbl .sealbl,.stage.hide-lbl .rlbl{display:none}
.stage[data-focus="ret"] .route-out{opacity:.25}
.stage[data-focus="zone"] .route-out,.stage[data-focus="zone"] .route-ret{opacity:.35}
.stage[data-focus="zone"] .zoneS,.stage[data-focus="zone"] .zoneN{stroke-width:3.5}
@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .stagewrap{flex:none}
  .card{overflow:visible}
}
.cnav{display:none}
@media (orientation:landscape) and (min-width:821px){
  html,body{height:auto}
  .app{height:auto;display:block}
  .top{margin-bottom:6px}
  h1{font-size:clamp(18px,2vw,24px)}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto auto auto auto 1fr auto;column-gap:14px;row-gap:10px;flex:none}
  .mapcol,.side{display:contents}
  .stagewrap{grid-column:1;grid-row:1 / span 5;flex:none;height:calc(100dvh - 84px);min-height:340px}
  .viewbar{grid-column:2;grid-row:1}
  .side .chips{grid-column:2;grid-row:2}
  #tools{grid-column:2;grid-row:3}
  .toolbar:not(#tools){grid-column:2;grid-row:4;align-self:start}
  .card{grid-column:1 / -1;grid-row:6;overflow:visible;flex:none}
  .cnav{display:inline-flex;align-items:center;justify-content:center}
}
@media (orientation:landscape) and (min-width:821px){
  body{padding-block:8px}
  .top{margin-bottom:4px}
  .sub{display:none}
  h1{font-size:clamp(16px,1.7vw,22px)}
  .main{grid-template-columns:minmax(0,1fr) 208px;column-gap:10px;row-gap:8px}
  .stagewrap{height:calc(100dvh - 54px);min-height:340px}
  .tb{font-size:14px;letter-spacing:.04em;min-height:38px;padding:4px 8px}
  .viewbar{flex-direction:column;align-items:stretch;gap:5px}
  .viewbar .tb{width:100%}
  .side .chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .side .chips[hidden]{display:none}
  .chip{min-width:0;min-height:36px;padding:2px 4px;font-size:16px;border-radius:18px}
  .chip[data-id="zone"],.chip[data-id="ret"],.chips .cnav{grid-column:span 2}
  #tools{flex-direction:column;align-items:stretch;gap:6px}
  #tools .grp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  #tools .grp:last-child{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tools .tb{padding:4px 2px}
  .layers{flex-direction:column;align-items:flex-start;gap:0;font-size:13px}
  .layers label{min-height:30px}
  .hint{display:none}
}
@media (orientation:landscape) and (min-width:821px){
  body{padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .app{position:relative}
  .top{position:absolute;top:0;right:0;width:196px;margin:0;display:block}
  h1{font-size:19px;line-height:1.1}
  .main{grid-template-columns:minmax(0,1fr) 196px;column-gap:8px;row-gap:7px}
  .viewbar{margin-top:46px}
  #tools .tb{font-size:13px;letter-spacing:0;padding:4px 0}
  .stagewrap{height:calc(100dvh - 12px);min-height:340px}
}
@media (prefers-reduced-motion:no-preference){ .chip,.tb{transition:background .15s} }
</style>
<style>html{color-scheme:light}:root[data-theme="dark"],:root{}img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
</head><body>

<div class="app">
  <header class="top">
    <h1>Paul's First Journey</h1>
    <div class="sub">Acts 13-14 &middot; From Syrian Antioch to the churches of Galatia and back</div>
  </header>
  <div class="main">
    <section class="mapcol" aria-label="Map of Paul's first journey">
      <div class="viewbar" id="viewbar" role="group" aria-label="Map zoom level">
        <button class="tb vb" data-v="0" aria-pressed="true">Globe</button>
        <button class="tb vb" data-v="1" aria-pressed="false">Mediterranean</button>
        <button class="tb vb" data-v="2" aria-pressed="false">Journey</button>
      </div>
      <div class="stagewrap" id="wrap">
        <div class="stage noanim" id="stage"><svg id="gv" viewBox="0 0 754 640" preserveAspectRatio="none" role="img" aria-label="Globe centered on the eastern Mediterranean with Galatia marked"></svg><svg id="mv" viewBox="0 0 754 640" preserveAspectRatio="none" role="img" aria-label="Map of the Mediterranean world"></svg><svg id="map" viewBox="0 0 754 640" preserveAspectRatio="none" role="img" aria-label="Map of southern Turkey and Cyprus with Paul's route"></svg><canvas id="ink"></canvas></div>
      </div>
      <div class="toolbar" id="tools">
        <div class="grp" role="group" aria-label="Drawing tool">
          <button class="tb" id="t-pen" aria-pressed="true">Pen</button>
          <button class="tb" id="t-er" aria-pressed="false">Eraser</button>
          <button class="tb" id="t-pt" aria-pressed="false">Pointer</button>
        </div>
        <div class="grp">
          <button class="tb" id="undo">Undo</button>
          <button class="tb" id="clear">Clear</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="layers" id="layers">
          <label for="l-out"><input type="checkbox" id="l-out" checked><span class="key"></span>Outbound</label>
          <label for="l-ret"><input type="checkbox" id="l-ret" checked><span class="key ret"></span>Return</label>
          <label for="l-zone"><input type="checkbox" id="l-zone" checked>Galatia</label>
          <label for="l-fing"><input type="checkbox" id="l-fing">Draw with finger or mouse</label>
        </div>
        <span class="hint">Apple Pencil draws in white. A finger taps. Each zoom level keeps its own drawings. Solid line is by road, dashed is by sea.</span>
      </div>
    </section>
    <aside class="side" aria-label="Stop details">
      <div class="chips" id="chips" role="group" aria-label="Choose a stop"></div>
      <article class="card" id="card" aria-live="polite"></article>
    </aside>
  </div>
</div>

    s+='<g clip-path="url(#gclip)"><path class="wavefill" d="M0,0H'+VB_W+'V'+VB_H+'H0Z"/><path class="grat" d="'+G.grat+'"/><path class="land" style="stroke-width:1.1" d="'+G.land+'"/></g>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+G.R+'" fill="url(#gshade)" style="pointer-events:none"/><circle cx="'+cx+'" cy="'+cy+'" r="'+G.R+'" fill="none" stroke="var(--frame)" stroke-width="2"/>';
    s+=T(L.europe,'EUROPE','rlbl','text-anchor="middle"')+T(L.africa,'AFRICA','rlbl','text-anchor="middle"')+T(L.asia,'ASIA','rlbl','text-anchor="middle"');
    s+=T(L.atlantic,'Atlantic Ocean','sealbl','text-anchor="middle"')+T(L.indian,'Indian Ocean','sealbl','text-anchor="middle"');
    var fb=G.frameBox;
    s+='<g class="zoomto" data-go="1" tabindex="0" role="button" aria-label="Zoom in to the Mediterranean"><polygon class="fbox" points="'+G.frame+'"/>'+
       '<text class="zlbl" x="'+((fb[0]+fb[2])/2)+'" y="'+(fb[3]+20)+'" text-anchor="middle" fill="var(--accent)">The Roman world &#9656;</text></g>';
    s+='<circle class="cdot" r="3.6" cx="'+G.rome[0]+'" cy="'+G.rome[1]+'"/>'+T([G.rome[0]-8,G.rome[1]+4],'Rome','lbl','text-anchor="end" style="font-size:13px"');
    s+='<circle class="cdot" r="3.6" cx="'+G.jerusalem[0]+'" cy="'+G.jerusalem[1]+'"/>'+T([G.jerusalem[0]-8,G.jerusalem[1]+14],'Jerusalem','lbl','text-anchor="end" style="font-size:13px"');
    s+='<g class="zone"><circle class="pulse" cx="'+G.gal[0]+'" cy="'+G.gal[1]+'" r="6"/><circle class="pin" cx="'+G.gal[0]+'" cy="'+G.gal[1]+'" r="6.5"/>'+
       '<text class="script" x="'+(G.gal[0]+12)+'" y="'+(G.gal[1]-8)+'" style="font-size:24px">Galatia</text></g>';
    s+='<text class="script" x="26" y="612" transform="rotate(-3 26 612)" style="font-size:22px">Where on earth is Galatia?</text>';
    s+=compass(690,592)+frames();
    document.getElementById('gv').innerHTML=s;
  }
  function mroute(legs,cls,arr){
    var tag=arr?'out':'ret', s='<g class="'+cls+'">';
    legs.forEach(function(l,i){ var o=offsetXY(l.p,arr?2.4:-2.4); var d='M'+o.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L');
      s+='<path class="casing'+(l.sea?' sea':'')+'" data-leg="'+tag+i+'" style="stroke-width:6.5;display:none" d="'+d+'"/>'; });
    legs.forEach(function(l,i){ var o=offsetXY(l.p,arr?2.4:-2.4); var d='M'+o.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L');
      s+='<path class="route'+(l.sea?' sea':'')+'" data-leg="'+tag+i+'" style="stroke-width:2.8;display:none" d="'+d+'"/>'; });
    return s+'</g>';
  }
  function buildMed(){
    var M=DATA.med, C=M.cities, Lb=M.labels, s='';
    s+='<rect class="sea" width="'+VB_W+'" height="'+VB_H+'"/><rect class="wavefill" width="'+VB_W+'" height="'+VB_H+'"/>';
    [[20,.28],[12,.4],[6,.6]].forEach(function(g){ s+='<path class="glow" d="'+M.land+'" style="stroke-width:'+g[0]+'px;opacity:'+g[1]+'"/>'; });
    s+='<path class="land" style="fill-rule:evenodd;stroke-width:1.2" d="'+M.land+'"/>';
    M.lonX.forEach(function(a){ s+='<path class="grat" d="M'+a[1]+',16 L'+a[1]+','+(VB_H-16)+'"/><text class="gl" x="'+a[1]+'" y="28" text-anchor="middle">'+a[0]+'°E</text>'; });
    M.latY.forEach(function(a){ s+='<path class="grat" d="M16,'+a[1]+' L'+(VB_W-16)+','+a[1]+'"/><text class="gl" x="20" y="'+(a[1]-4)+'">'+a[0]+'°N</text>'; });
    s+='<g class="zone"><polygon class="zoneS" points="'+M.zone.map(function(p){return p.join(',');}).join(' ')+'"/>'+T(M.zoneLabel,'Galatia','zlbl','text-anchor="middle" fill="var(--olive)" style="font-size:13px"')+'</g>';
    var rl='text-anchor="middle" style="font-size:12px"';
    s+=T(Lb.italia,'ITALIA','rlbl',rl)+T(Lb.macedonia,'MACEDONIA','rlbl',rl)+T(Lb.asia,'ASIA','rlbl',rl)+T(Lb.syria,'SYRIA','rlbl',rl)+T(Lb.egypt,'EGYPT','rlbl',rl)+T(Lb.libya,'LIBYA','rlbl',rl);
    s+=T(Lb.med,'Mediterranean Sea','sealbl','text-anchor="middle" style="font-size:19px"')+T(Lb.black,'Black Sea','sealbl','text-anchor="middle"');
    s+=texture();
    s+=mroute(M.ret,'route-ret',false)+mroute(M.out,'route-out',true);
    var names={rome:'Rome',corinth:'Corinth',ephesus:'Ephesus',jerusalem:'Jerusalem',alexandria:'Alexandria'};
    var offs={rome:[8,5,'start'],corinth:[-8,-7,'end'],ephesus:[-8,-6,'end'],jerusalem:[8,16,'start'],alexandria:[8,5,'start']};
    Object.keys(names).forEach(function(k){ var p=C[k], o=offs[k];
      s+='<circle class="cdot" cx="'+p[0]+'" cy="'+p[1]+'" r="4.2"/>'+T([p[0]+o[0],p[1]+o[1]],names[k],'lbl','text-anchor="'+o[2]+'" style="font-size:15px"'); });
    s+='<circle class="cdot" cx="'+C.antioch[0]+'" cy="'+C.antioch[1]+'" r="5.5" style="stroke:var(--accent);stroke-width:3"/>'+T([C.antioch[0]+9,C.antioch[1]-4],'Syrian Antioch','lbl','style="font-size:15px"');
    var fr=M.frame;
    s+='<g class="zoomto" data-go="2" tabindex="0" role="button" aria-label="Zoom in to Paul\'s first journey"><rect class="fbox" x="'+fr[0][0]+'" y="'+fr[0][1]+'" width="'+(fr[1][0]-fr[0][0])+'" height="'+(fr[1][1]-fr[0][1])+'"/>'+
       '<text class="zlbl" x="'+fr[1][0]+'" y="'+(fr[0][1]-9)+'" text-anchor="end" fill="var(--accent)">Paul\'s first journey &#9656;</text></g>';
    s+='<text class="script" x="28" y="606" transform="rotate(-3 28 606)" style="font-size:24px">Greetings from the Roman World</text>';
    s+=compass(690,592);
    s+='<g transform="translate(528,622)"><path d="M0,0 L'+M.scale.px+',0 M0,-5 L0,5 M'+(M.scale.px/2)+',-3 L'+(M.scale.px/2)+',3 M'+M.scale.px+',-5 L'+M.scale.px+',5" stroke="var(--fg)" stroke-width="2" fill="none"/>'+
       '<text x="0" y="-9" class="gl" style="font-size:13px;fill:var(--fg);opacity:1">0</text><text x="'+M.scale.px+'" y="-9" class="gl" text-anchor="end" style="font-size:13px;fill:var(--fg);opacity:1">'+M.scale.miles+' miles</text></g>';
    s+=frames();
    document.getElementById('mv').innerHTML=s;
  }

  /* ---- zoom levels ---- */
  var VIEWS=['globe','med','journey'], view=0, busy=false, tmr=null;
  var svgs=[document.getElementById('gv'),document.getElementById('mv'),document.getElementById('map')];
  var gb=DATA.globe.frameBox, mf=DATA.med.frame;
  /* A[k]: maps level k coordinates into level k-1 coordinates (scale + shift) */
  var A=[null,
    {sx:(gb[2]-gb[0])/VB_W, sy:(gb[3]-gb[1])/VB_H, tx:gb[0], ty:gb[1]},
    {sx:(mf[1][0]-mf[0][0])/VB_W, sy:(mf[1][1]-mf[0][1])/VB_H, tx:mf[0][0], ty:mf[0][1]}];
  function mapTo(v,c){  /* level v coordinates into level c coordinates */
    if(v===c) return [1,1,0,0];
    if(v>c){
      var m={sx:1,sy:1,tx:0,ty:0};
      for(var k=v;k>c;k--){ m={sx:A[k].sx*m.sx, sy:A[k].sy*m.sy, tx:A[k].tx+A[k].sx*m.tx, ty:A[k].ty+A[k].sy*m.ty}; }
      return [m.sx,m.sy,m.tx,m.ty];
    }
    var q=mapTo(c,v); return [1/q[0],1/q[1],-q[2]/q[0],-q[3]/q[1]];
  }
  function applyView(){
    var k=stage.clientWidth/VB_W;
    svgs.forEach(function(el,i){
      var m=i===view?[1,1,0,0]:mapTo(i,view);
      if(m[0]>6) m=[6,6,0,0];
      el.style.transform='matrix('+m[0]+',0,0,'+m[1]+','+(m[2]*k)+','+(m[3]*k)+')';
      el.classList.toggle('active',i===view);
    });
  }
  var ink=[{strokes:[],undo:[]},{strokes:[],undo:[]},{strokes:[],undo:[]}];
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function updateBar(){
    document.querySelectorAll('.vb').forEach(function(b){ b.setAttribute('aria-pressed',+b.dataset.v===view?'true':'false'); });
  }
  var VCARD={
    globe:{kicker:'Zoom level 1 of 3',name:'Where on earth is Galatia?',ref:'The whole world',blocks:[
      ['Find it','Galatia is the middle of what is now Turkey: the high plateau of Anatolia, roughly a kilometer above sea level, at about 38&deg; N. The pulsing pin is the heart of the region.'],
      ['Where it sits','This is the land bridge where Europe, Asia and Africa nearly touch. Traders, soldiers and travelers moving between the Aegean world and Syria crossed this plateau.'],
      ['How far','From Rome to Iconium is about '+DATA.dist.romeIco.toLocaleString()+' miles in a straight line. From Jerusalem it is about '+DATA.dist.jerIco+' miles.']]},
    med:{kicker:'Zoom level 2 of 3',name:'Paul\'s world: the Mediterranean',ref:'Acts 13-14; later Acts 15, 18, 19, 28',blocks:[
      ['What you are seeing','The dashed box is the first journey: Syrian Antioch, Cyprus and the highlands of south Galatia. Later chapters of Acts take Paul to the Jerusalem council (15), Corinth (18), Ephesus (19) and finally Rome (28).'],
      ['Why it matters for Galatians','These churches were inland, about '+DATA.dist.antPis+' miles in a straight line from the sending church in Syrian Antioch and farther still from Jerusalem. Paul is writing across that distance, and he is astonished at how quickly they are turning (Galatians 1:6).'],
      ['Provinces','Galatia was a single Roman province, created in 25 BC, and sat next to Asia, Cilicia and Syria on the map.']]}
  };
  function showViewCard(name){
    var d=VCARD[name], card=document.getElementById('card'), i=VIEWS.indexOf(name);
    var h='<div class="vcard"><div class="kicker">'+d.kicker+'</div><h2>'+d.name+'</h2><div class="ref">'+d.ref+'</div>';
    d.blocks.forEach(function(b){ h+='<div class="blk"><div class="lab">'+b[0]+'</div><p>'+b[1]+'</p></div>'; });
    h+='<div class="step">'+(i>0?'<button class="tb" id="vc-out">&minus; Zoom out</button>':'')+'<button class="tb" id="vc-in" style="background:var(--accent);border-color:var(--accent);color:#fff">Zoom in +</button></div></div>';
    card.innerHTML=h; card.scrollTop=0;
  }
  function renderSide(){
    var ce=document.getElementById('chips');
    if(view===2){ ce.hidden=false; select(cur); } else { ce.hidden=true; showViewCard(VIEWS[view]); }
  }
  function setView(v){
    ink[view]={strokes:strokes,undo:undoStack}; live=null;
    view=v; strokes=ink[v].strokes; undoStack=ink[v].undo;
    busy=true; canvas.style.opacity=0;
    applyView(); updateBar(); renderSide();
    clearTimeout(tmr); tmr=setTimeout(function(){ busy=false; canvas.style.opacity=1; redraw(); },reduced?30:880);
  }
  function go(target){
    target=Math.max(0,Math.min(2,target));
    if(target===view||busy) return;
    var nxt=view+(target>view?1:-1);
    setView(nxt);
    if(nxt!==target) setTimeout(function(){ setView(target); },reduced?40:720);
  }

  /* ---- detail card and chips ---- */
  var cur='zone', stage=document.getElementById('stage');
  function chips(){
    var c=document.getElementById('chips'), h='';
    ORDER.forEach(function(id){
      var label=id==='zone'?EXTRA.zone.chip:id==='ret'?EXTRA.ret.chip:stopById(id).n;
      h+='<button class="chip" data-id="'+id+'" aria-label="'+(id==='zone'||id==='ret'?EXTRA[id].name:'Stop '+label+', '+stopById(id).name)+'">'+label+'</button>';
    });
    c.innerHTML=h+'<button class="tb cnav" id="cprev">&lsaquo; Back</button><button class="tb cnav" id="cnext">Next &rsaquo;</button>';
  }
  function select(id){
    cur=id;
    var d, kick;
    if(id==='zone'||id==='ret'){ d=EXTRA[id]; kick=d.kicker; stage.setAttribute('data-focus',id); }
    else { d=stopById(id); kick='Stop '+d.n+' of 8'; stage.removeAttribute('data-focus'); }
    var i=ORDER.indexOf(id);
    var card=document.getElementById('card');
    card.innerHTML='<div class="kicker">'+kick+'</div><h2>'+d.name+'</h2><div class="ref">'+d.ref+'</div>'+
      '<div class="blk"><div class="lab">Read aloud</div><p class="read">'+d.read+'</p></div>'+
      '<div class="blk"><div class="lab">What happens</div><p>'+d.what+'</p></div>'+
      '<div class="blk"><div class="lab">Why it matters for Galatians</div><p>'+d.why+'</p></div>'+
      '<div class="step"><button class="tb" id="prev"'+(i===0?' disabled style="opacity:.4"':'')+'>Back</button><button class="tb" id="next"'+(i===ORDER.length-1?' disabled style="opacity:.4"':'')+'>Next</button><button class="tb" id="vc-out">&minus; Zoom out</button></div>';
    document.querySelectorAll('.chip').forEach(function(b){ if(b.dataset.id===id) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); });
    document.querySelectorAll('.stop').forEach(function(g){ g.classList.toggle('on',g.dataset.id===id); });
    visited[id]=1; applyReveal();
    card.scrollTop=0;
    syncRoutes();
  }
  function step(dir){ var i=ORDER.indexOf(cur)+dir; if(i>=0&&i<ORDER.length) select(ORDER[i]); }

  /* ---- layout sizing ---- */
  var wrap=document.getElementById('wrap'), canvas=document.getElementById('ink'), ctx=canvas.getContext('2d');
  var RATIO=VB_W/VB_H, mq=window.matchMedia('(max-width:820px)');
  function sizeStage(){
    var w=wrap.clientWidth, h=wrap.clientHeight;
    if(mq.matches){ h=w/RATIO; }
    else { var w2=Math.min(w,h*RATIO); h=w2/RATIO; w=w2; }
    stage.style.width=Math.floor(w)+'px'; stage.style.height=Math.floor(h)+'px';
    var dpr=window.devicePixelRatio||1, r=stage.getBoundingClientRect();
    canvas.width=Math.max(1,Math.round(r.width*dpr)); canvas.height=Math.max(1,Math.round(r.height*dpr));
    stage.classList.add('noanim'); applyView(); void stage.offsetWidth; stage.classList.remove('noanim');
    redraw();
  }

  /* ---- drawing ---- */
  var strokes=[], undoStack=[], live=null, tool='pen', colorKey='c1', size=2, finger=false;
  var SIZES={1:3,2:6,3:9};
  function colorOf(k){ return getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim()||'#000'; }
  function paint(s){
    var W=canvas.width,H=canvas.height,sc=W/VB_W, p=s.pts; if(!p.length) return;
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    [['rgba(18,30,38,.85)',3.4],['#FFFFFF',0]].forEach(function(pass){
      ctx.strokeStyle=pass[0]; ctx.fillStyle=pass[0];
      if(p.length===1){ ctx.beginPath(); ctx.arc(p[0][0]*W,p[0][1]*H,s.size*sc*.6+pass[1]*sc*.5,0,6.2832); ctx.fill(); }
      for(var j=1;j<p.length;j++){
        var pr=s.pen?(p[j][2]+p[j-1][2])/2:.5; ctx.lineWidth=s.size*sc*(.55+pr*.9)+pass[1]*sc;
        ctx.beginPath(); ctx.moveTo(p[j-1][0]*W,p[j-1][1]*H); ctx.lineTo(p[j][0]*W,p[j][1]*H); ctx.stroke();
      }
    });
    ctx.restore();
  }
  function redraw(){ ctx.clearRect(0,0,canvas.width,canvas.height); strokes.forEach(paint); if(live&&live.tool!=='er') paint(live); }
  function norm(e){ var r=stage.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,e.pressure>0?e.pressure:.5]; }
  function isInk(e){ if(busy||tool==='pt') return false; return e.pointerType==='pen' || finger; }
  function eraseAt(pt){
    var r=stage.getBoundingClientRect(), rad=18, before=strokes.length;
    var keep=strokes.filter(function(s){
      return !s.pts.some(function(q){ return Math.hypot((q[0]-pt[0])*r.width,(q[1]-pt[1])*r.height)<rad; });
    });
    if(keep.length!==before){ if(!live.snap){ live.snap=strokes.slice(); } strokes=keep; redraw(); }
  }
  stage.addEventListener('pointerdown',function(e){
    if(!isInk(e)) return;
    e.preventDefault();
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    var pt=norm(e);
    live={id:e.pointerId,tool:tool,color:colorKey,size:SIZES[size],pen:e.pointerType==='pen',pts:[pt],snap:null};
    if(tool==='er') eraseAt(pt); else paint(live);
  });
  stage.addEventListener('pointermove',function(e){
    if(!live||e.pointerId!==live.id) return;
    e.preventDefault();
    var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[]; if(!evs.length) evs=[e];
    evs.forEach(function(ev){
      var pt=norm(ev);
      if(live.tool==='er'){ eraseAt(pt); return; }
      live.pts.push(pt);
    });
    redraw();
  });
  function end(e){
    if(!live||e.pointerId!==live.id) return;
    if(live.tool==='er'){ if(live.snap) undoStack.push(live.snap); }
    else { undoStack.push(strokes.slice()); strokes.push(live); }
    live=null; redraw();
  }
  stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
  stage.addEventListener('contextmenu',function(e){ e.preventDefault(); });

  /* ---- toolbar wiring ---- */
  function pressed(ids,on){ ids.forEach(function(id){ document.getElementById(id).setAttribute('aria-pressed',id===on?'true':'false'); }); }
  var TOOLS={'t-pen':'pen','t-er':'er','t-pt':'pt'};
  Object.keys(TOOLS).forEach(function(id){ document.getElementById(id).addEventListener('click',function(){ tool=TOOLS[id]; pressed(Object.keys(TOOLS),id); }); });
  document.getElementById('undo').addEventListener('click',function(){ if(undoStack.length){ strokes=undoStack.pop(); redraw(); } });
  var clearBtn=document.getElementById('clear'), clearTimer=null;
  clearBtn.addEventListener('click',function(){
    if(clearBtn.classList.contains('on')){
      undoStack.push(strokes.slice()); strokes=[]; redraw(); clearBtn.classList.remove('on'); clearBtn.textContent='Clear'; clearTimeout(clearTimer);
    } else {
      if(!strokes.length) return;
      clearBtn.classList.add('on'); clearBtn.textContent='Tap again to clear';
      clearTimer=setTimeout(function(){ clearBtn.classList.remove('on'); clearBtn.textContent='Clear'; },3000);
    }
  });
  [['l-out','hide-out'],['l-ret','hide-ret'],['l-zone','hide-zone']].forEach(function(p){
    document.getElementById(p[0]).addEventListener('change',function(e){ stage.classList.toggle(p[1],!e.target.checked); });
  });
  document.getElementById('l-fing').addEventListener('change',function(e){ finger=e.target.checked; });

  document.getElementById('chips').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(b) select(b.dataset.id); else if(e.target.id==='cprev') step(-1); else if(e.target.id==='cnext') step(1); });
  document.getElementById('card').addEventListener('click',function(e){
    var id=e.target.id;
    if(id==='prev') step(-1); else if(id==='next') step(1);
    else if(id==='vc-in') go(view+1); else if(id==='vc-out') go(view-1);
  });
  [].forEach.call(document.querySelectorAll('.vb'),function(b){ b.addEventListener('click',function(){ go(+b.dataset.v); }); });
  var visited={};
  function applyReveal(){ document.querySelectorAll('.stop,.slbl').forEach(function(g){ g.classList.toggle('unrev',ORDER.indexOf(g.dataset.id)>ORDER.indexOf(cur)); }); }
  stage.classList.add('reveal');
  stage.addEventListener('click',function(e){
    var z=e.target.closest('.zoomto'); if(z){ go(+z.dataset.go); return; }
    var g=e.target.closest('.stop'); if(g) select(g.dataset.id);
  });
  stage.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ') return;
    var t=e.target; if(!t.classList) return;
    if(t.classList.contains('zoomto')){ e.preventDefault(); go(+t.dataset.go); }
    else if(t.classList.contains('stop')){ e.preventDefault(); select(t.dataset.id); }
  });
  document.addEventListener('keydown',function(e){
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==='+'||e.key==='=') go(view+1); else if(e.key==='-'||e.key==='_') go(view-1);
    else if(view===2&&e.key==='ArrowRight') step(1); else if(view===2&&e.key==='ArrowLeft') step(-1);
  });

  /* ---- start ---- */
  buildMap(); buildMed(); buildGlobe(); bindLegs(); chips(); select('zone'); updateBar(); renderSide();
  if(window.ResizeObserver) new ResizeObserver(sizeStage).observe(wrap); window.addEventListener('resize',sizeStage);
  if(mq.addEventListener) mq.addEventListener('change',sizeStage);
  var dm=window.matchMedia('(prefers-color-scheme: dark)'); if(dm.addEventListener) dm.addEventListener('change',redraw);
  new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  sizeStage();
  requestAnimationFrame(function(){ stage.classList.remove('noanim'); });
})();
</script>
